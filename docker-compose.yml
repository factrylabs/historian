# Quick-start Docker Compose file for Factry Historian.
#
# This file uses well-known default passwords so that `docker compose up -d`
# works with no configuration. It is meant for evaluation on a local machine
# only. For anything reachable by others, use ../advanced, which requires
# passwords to be supplied explicitly.

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  historian:
    image: "factry/historian:latest"
    hostname: "historian"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      AUTO_MIGRATE: "true"
      DB_HOST: "postgres"
      DB_NAME: "factry_historian"
      DB_USER_NAME: "factry"
      DB_PASSWORD: "password"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - "historian:/var/opt/factry"
    restart: "unless-stopped"
    logging: *logging

  postgres:
    image: "postgres:17-alpine"
    hostname: "postgres"
    environment:
      POSTGRES_DB: "factry_historian"
      POSTGRES_USER: "factry"
      POSTGRES_PASSWORD: "password"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factry -d factry_historian"]
      interval: 5s
      timeout: 5s
      retries: 5
    # SIGINT is PostgreSQL's fast shutdown. The default SIGTERM waits for
    # clients to disconnect and then gets SIGKILLed, forcing crash recovery.
    stop_signal: "SIGINT"
    stop_grace_period: 60s
    logging: *logging

  grafana:
    image: "grafana/grafana-oss:latest"
    hostname: "grafana"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_INSTALL_PLUGINS: "factry-historian-datasource"
    ports:
      - "3000:3000"
    volumes:
      - "grafana:/var/lib/grafana"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    logging: *logging

  influxdb:
    image: "influxdb:1.12"
    hostname: "influx"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: "factry"
      INFLUXDB_ADMIN_PASSWORD: "password"
      INFLUXDB_HTTP_FLUX_ENABLED: "true"
      INFLUXDB_HTTP_LOG_ENABLED: "false"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "false"
    volumes:
      - "influxdb:/var/lib/influxdb"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:8086/ping || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    # Give InfluxDB time to flush its WAL instead of being SIGKILLed after 10s.
    stop_grace_period: 60s
    logging: *logging

volumes:
  grafana:
  historian:
  postgres:
  influxdb:
