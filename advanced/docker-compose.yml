# Configurable Docker Compose file for Factry Historian.
#
# Every credential must be supplied explicitly; there are no default
# passwords. See .env.example and README.md.

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-database-env: &database-env
  DB_HOST: postgres
  DB_NAME: ${DB_NAME:-factry_historian}
  DB_USER_NAME: ${DB_USER_NAME:-factry}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

services:
  historian:
    image: "factry/historian:${VERSION:-v8.1.9}"
    hostname: "historian"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      <<: *database-env
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    ports:
      # Plain HTTP; belongs behind a TLS terminating proxy. See README.md.
      - "${REST_BIND_ADDRESS:-0.0.0.0}:${REST_PORT:-8000}:8000"
      # Historian terminates TLS on the collector gRPC port itself.
      - "${GRPC_BIND_ADDRESS:-0.0.0.0}:${GRPC_PORT:-8001}:8001"
    volumes:
      - "historian:/var/opt/factry"
    restart: "unless-stopped"
    logging: *logging


  postgres:
    image: "postgres:17-alpine"
    hostname: "postgres"
    environment:
      POSTGRES_DB: ${DB_NAME:-factry_historian}
      POSTGRES_USER: ${DB_USER_NAME:-factry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - "postgres:/var/lib/postgresql/data"
    restart: "unless-stopped"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER_NAME:-factry} -d ${DB_NAME:-factry_historian}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    # SIGINT is PostgreSQL's fast shutdown. The default SIGTERM waits for
    # clients to disconnect and then gets SIGKILLed, forcing crash recovery.
    stop_signal: "SIGINT"
    stop_grace_period: 60s
    logging: *logging

  grafana:
    image: "grafana/grafana-oss:${GF_VERSION:-13.0.2}"
    hostname: grafana
    environment:
      GF_PLUGINS_ENABLE_ALPHA: "true"
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-http://127.0.0.1}"
      # Required when GF_SERVER_ROOT_URL carries a path, and a no-op when it
      # does not, so it is always on rather than a knob to keep in step.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_UPDATE_CHECK_DISABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_NAME: ${GF_AUTH_ANONYMOUS_ORG_NAME:-Factry}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_INSTALL_PLUGINS: "factry-historian-datasource ${GF_HISTORIAN_PLUGIN_VERSION:-3.3.0}"
    ports:
      - "${GF_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - "grafana:/var/lib/grafana"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    logging: *logging

  influxdb:
    image: "influxdb:1.12"
    hostname: influx
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      # Only applied when the data directory is empty. Rotating this variable
      # on an existing deployment is a no-op; see README.md.
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER:-factry}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD is required}
      INFLUXDB_HTTP_FLUX_ENABLED: "true"
      INFLUXDB_HTTP_LOG_ENABLED: "false"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "false"
    volumes:
      - "influxdb:/var/lib/influxdb"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:8086/ping || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    # Give InfluxDB time to flush its WAL instead of being SIGKILLed after 10s.
    stop_grace_period: 60s
    logging: *logging

volumes:
  grafana:
  historian:
  postgres:
  influxdb:
